[project]
name = "e-commerce-operations-brain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "apscheduler>=3.10",
    "asyncpg>=0.29.0",
    "faker>=28.0.0",
    "fastapi>=0.115.0",
    "fastmcp>=3.2.3",
    "httpx>=0.27.0",
    "langchain>=1.2.15",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langfuse>=4.2.0",
    "langgraph>=1.1.6",
    "mcp[cli]>=1.27.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "sse-starlette>=3.3.4",
    "structlog>=24.1.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["evals"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.19",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "ASYNC", "RUF"]
ignore = [
    "E501",    # line too long — not enforced
    "B008",    # function call in default arg — FastAPI Depends() pattern
    "RUF012",  # mutable class attrs — Pydantic/SQLAlchemy pattern
]

[tool.ruff.lint.isort]
known-first-party = ["ai_ops_engine", "backend", "evals", "mcp_servers", "data_gen", "db"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = false
exclude = [".venv/"]

[[tool.mypy.overrides]]
module = [
    "fastmcp.*",
    "mcp.*",
    "langfuse.*",
    "apscheduler.*",
    "psycopg2.*",
    "pgvector.*",
    "alembic.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["data_gen.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["db.*"]
ignore_missing_imports = true
disallow_untyped_defs = false
